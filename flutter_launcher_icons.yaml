# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/images/app_logo_1.png"

  android: "ic_launcher"
  image_path_android: "assets/images/app_logo_1.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/app_logo_1.png"
  adaptive_icon_monochrome: "assets/images/app_logo_1.png"

  ios: true
  image_path_ios: "assets/images/app_logo_1.png"
  remove_alpha_channel_ios: true
